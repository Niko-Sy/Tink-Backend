version: "2"
sql:
  # 合并所有查询到一个配置中，避免 prepared statements 冲突
  - engine: "postgresql"
    queries: 
      - "./dbsql/query/"
      - "./dbsql/extension/"
    schema: "./dbsql/migration/"
    database:
      uri: "postgres://postgres:sy20050401@120.27.227.190:5432/chatroom?sslmode=disable"
    gen:
      go:
        package: "db"
        out: "./db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true