# 数据库配置
database:
  # url: "postgres://postgres:123456@localhost:5432/chatroom?sslmode=disable"
  url: "postgres://postgres:sy20050401@120.27.227.190:5432/chatroom?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300  # 秒

# 服务器配置
server:
  port: 8080
  host: "0.0.0.0"
  base_url: "http://120.27.227.190:8080"
  allowed_origins:
    - "http://120.27.227.190"
    - "http://120.27.227.190:11451"
    - "http://120.27.227.190:8080"
    - "http://127.0.0.1:11451"
    - "http://localhost:11451"

# 图片上传配置
upload:
  upload_dir: "./uploads"
  max_size: 5242880  # 5MB (5 * 1024 * 1024)
  allowed_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "image/webp"
  url_prefix: "/static/images"
  default_avatar: "https://www.tastywhut.site/pic/avatars/DefaultAvatar.jpg"

# JWT 配置
jwt:
  secret: "zIkOpjHTvIHUZabGPr4wPGADXdCMDZauFaZIjbeZ5YI"
  expiration: 86400  # 24小时 (秒)
  refresh_expiration: 604800  # 7天，秒

# WebSocket 配置
websocket:
  read_buffer_size: 524288   # 512KB
  write_buffer_size: 524288  # 512KB
  ping_interval: 30          # 心跳间隔 (秒)
  pong_timeout: 60           # 超时时间 (秒)

# 日志配置
logger:
  log_dir: "./logs"
  log_level: "info"  # debug, info, warn, error
  enable_console: true
  enable_file: true
  max_age: 30  # 日志保留天数
# 个人项目：好友、私信与群邀请直接开启
social:
  friends: true
  direct_messages: true
  room_invitations: true
